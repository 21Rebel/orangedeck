; Ausschnitt fuer ~/.config/polybar/config.ini
; Den Namen "orangedeck" in modules-right aufnehmen.
;
; Gilt genauso fuer i3blocks und yambar -- alle lesen eine Zeile.
[module/orangedeck]
type = custom/script
exec = ~/.local/bin/orangedeck --polybar
interval = 10
click-left = ~/.local/bin/orangedeck-window
format-foreground = #f7931a
