; Ausschnitt fuer ~/.config/polybar/config.ini
; Den Namen "btcfeed" in modules-right aufnehmen.
;
; Gilt genauso fuer i3blocks und yambar -- alle lesen eine Zeile.
[module/btcfeed]
type = custom/script
exec = ~/.local/bin/btcfeed --polybar
interval = 10
click-left = ~/.local/bin/btcfeed-window
format-foreground = #f7931a
